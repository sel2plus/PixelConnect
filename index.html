<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL CONNECT — Fast & Secure VPN</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #ffffff;
            --white-90: rgba(255,255,255,0.9);
            --white-70: rgba(255,255,255,0.7);
            --white-50: rgba(255,255,255,0.5);
            --white-30: rgba(255,255,255,0.3);
            --white-15: rgba(255,255,255,0.15);
            --white-08: rgba(255,255,255,0.08);
            --white-05: rgba(255,255,255,0.05);
            --white-03: rgba(255,255,255,0.03);
            --black: #000000;
            --black-pure: #0a0a0a;
            --radius: 18px;
            --radius-sm: 14px;
            --transition: 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Noise overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.025;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255,255,255,0.03) 2px,
                rgba(255,255,255,0.03) 4px
            );
        }

        /* Grid pattern */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(var(--white-05) 1px, transparent 1px),
                linear-gradient(90deg, var(--white-05) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 28px;
            position: relative;
            z-index: 1;
        }

        /* ============ HEADER ============ */
        header {
            text-align: center;
            padding: 70px 0 30px;
        }

        .logo-shield {
            width: 90px;
            height: 90px;
            margin: 0 auto 28px;
            border: 2px solid var(--white-30);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 30%, var(--white-08), transparent 70%);
            box-shadow: 
                0 0 60px rgba(255,255,255,0.04),
                inset 0 0 60px rgba(255,255,255,0.02);
            position: relative;
            animation: shieldPulse 4s ease-in-out infinite;
        }

        .logo-shield svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: var(--white);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes shieldPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255,255,255,0.03); }
            50% { box-shadow: 0 0 70px rgba(255,255,255,0.08); }
        }

        h1 {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 16px;
            line-height: 1;
            margin-bottom: 4px;
            text-shadow: 0 0 80px rgba(255,255,255,0.08);
        }

        .subtitle {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 11px;
            color: var(--white-50);
            margin-bottom: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--white-15);
            padding: 5px 16px;
            border-radius: 50px;
            font-size: 10px;
            letter-spacing: 2.5px;
            color: var(--white-50);
            text-transform: uppercase;
        }

        .badge .pulse-dot {
            width: 5px;
            height: 5px;
            background: var(--white);
            border-radius: 50%;
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ============ PHONE MOCKUP ============ */
        .phone-mockup {
            width: 170px;
            height: 170px;
            margin: 0 auto 30px;
            border: 2px solid var(--white-15);
            border-radius: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--white-03), transparent);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            position: relative;
            animation: float 7s ease-in-out infinite;
        }

        .phone-mockup::after {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 5px;
            background: var(--white-08);
            border-radius: 0 0 10px 10px;
        }

        .phone-screen {
            width: 140px;
            height: 140px;
            border-radius: 28px;
            background: linear-gradient(145deg, var(--white-05), transparent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-screen .shield-icon {
            font-size: 56px;
            opacity: 0.7;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            33% { transform: translateY(-14px); }
            66% { transform: translateY(6px); }
        }

        /* ============ FEATURES ============ */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 30px 0;
        }

        .feature-card {
            border: 1px solid var(--white-08);
            border-radius: var(--radius-sm);
            padding: 18px 10px;
            text-align: center;
            background: var(--white-03);
            backdrop-filter: blur(10px);
            transition: var(--transition);
            cursor: default;
        }

        .feature-card:hover {
            border-color: var(--white-30);
            background: var(--white-05);
            transform: translateY(-3px);
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .feature-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--white-50);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ============ BUTTONS ============ */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 17px;
            background: var(--white);
            color: var(--black);
            text-decoration: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: var(--transition);
            margin: 10px 0;
            border: 2px solid var(--white);
        }

        .btn-primary:hover {
            background: var(--black);
            color: var(--white);
            box-shadow: 0 0 50px rgba(255,255,255,0.08);
        }

        .btn-arrow {
            font-size: 18px;
            transition: transform 0.3s;
        }

        .btn-primary:hover .btn-arrow {
            transform: translateY(3px);
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border: 1px solid var(--white-15);
            color: var(--white-70);
            text-decoration: none;
            border-radius: var(--radius);
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: var(--transition);
            margin: 8px 0;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background: var(--white-05);
            border-color: var(--white-50);
            color: var(--white);
        }

        /* ============ QR SECTION ============ */
        .qr-box {
            text-align: center;
            margin: 22px 0;
            padding: 22px;
            border: 1px solid var(--white-08);
            border-radius: var(--radius);
            background: var(--white-03);
        }

        .qr-box img {
            width: 90px;
            height: 90px;
            display: block;
            margin: 0 auto 10px;
        }

        .qr-caption {
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--white-30);
            text-transform: uppercase;
        }

        /* ============ INFO STRIP ============ */
        .info-strip {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 18px 0;
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--white-30);
            text-transform: uppercase;
        }

        .info-strip .sep {
            color: var(--white-15);
        }

        /* ============ DIVIDER ============ */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 30px 0;
            color: var(--white-15);
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--white-08), transparent);
        }

        /* ============ FOOTER ============ */
        footer {
            text-align: center;
            padding: 36px 0;
            font-size: 9px;
            letter-spacing: 2.5px;
            color: var(--white-15);
            text-transform: uppercase;
            border-top: 1px solid var(--white-05);
            margin-top: 36px;
        }

        footer a {
            color: var(--white-30);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--white-70);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 420px) {
            h1 {
                font-size: 38px;
                letter-spacing: 10px;
            }
            .subtitle {
                font-size: 14px;
                letter-spacing: 7px;
            }
            .features-grid {
                gap: 5px;
            }
            .feature-card {
                padding: 14px 6px;
                border-radius: 12px;
            }
            .feature-icon {
                font-size: 20px;
            }
            .feature-label {
                font-size: 8px;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
